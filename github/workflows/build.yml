name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$(dirname "$(find src -name gradlew | head -1)")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk/"

      - uses: actions/upload-artifact@v4
        with:
          name: TuneNest-apk
          path: apk/*.apk
